name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Always install from the lockfile. Reusing a compiled node_modules tree
      # can hide ABI and dependency drift, especially for better-sqlite3.
      - run: npm ci
      - run: npm run verify:release
        env:
          NEXT_TELEMETRY_DISABLED: "1"
