<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kinetic Marble Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#101218;color:#f3f2f8;font:14px system-ui;padding:24px}main{max-width:900px;margin:auto}.eyebrow{color:#bba2ff;font-size:11px;letter-spacing:.15em}h1{font-size:clamp(24px,4vw,38px);letter-spacing:-.04em;margin:10px 0}p{color:#b9bdcc;line-height:1.6}.stage{border:1px solid #ffffff20;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 100%,#bba2ff18,transparent 70%),#151923}canvas{display:block;width:100%;aspect-ratio:16/9;touch-action:manipulation}.stats,.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px}.stats div{flex:1;background:#ffffff07;border-radius:12px;padding:14px;min-width:95px}strong{display:block;font-size:22px;font-variant-numeric:tabular-nums;margin-top:6px}small{color:#acb4c8}button{min-height:44px;border:1px solid #ffffff25;border-radius:8px;background:#252a39;color:#fff;padding:8px 16px;cursor:pointer;transition:background .15s,transform .15s}button:hover{background:#363d52}button:active{transform:scale(.96)}button:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid #bba2ff;outline-offset:3px}label{display:flex;align-items:center;gap:8px}@media(max-width:480px){body{padding:14px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style><main><div class="eyebrow">OPEN EVAL / PLAYGROUND</div><h1>Kinetic Marble Lab</h1><p>Gravity, collisions, and a handful of colorful chaos.</p><div class="stage"><canvas width="640" height="360" tabindex="0" aria-label="Kinetic Marble Lab interactive scene"></canvas></div><div class="stats"><div><small>Time in motion</small><strong id="clock">0.0s</strong></div><div><small>Interactions / bounces</small><strong id="score">0</strong></div><div><small>Particles</small><strong>18</strong></div></div><div class="controls"><button id="pause">Pause</button><button id="reset">Reset</button><button id="action">Send a ripple</button><label>Tempo <input id="speed" aria-label="Tempo" type="range" min="0.25" max="2" step="0.25" value="1"></label></div><p>Tap the scene to add energy. Adjust tempo or pause to study the motion. This reference demonstrates one solution; it is not an agent result.</p></main><script>const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const mode="marbles", count=18;let time=0,score=0,paused=false,speed=1,particles=[];
function reset(){time=0;score=0;particles=Array.from({length:count},(_,i)=>({x:30+(i*73)%580,y:mode==='rhythm'?(i===0?330:(i*47)%290):30+(i*41)%280,vx:(i%3-1)*45,vy:20+i%7*9,phase:i*.7,lane:i%4}));}
function interact(lane=0){if(mode==='rhythm'){const p=particles.find(p=>p.lane===lane&&p.y>=300);if(p){score++;p.y=0;}}else{particles.forEach((p,i)=>{p.vy=-90-i%7*12;p.vx+=mode==='fireflies'?25:10;});score++;}}
function step(dt){dt=Math.max(0,Math.min(.05,Number(dt)||0));time+=dt;particles.forEach((p,i)=>{if(mode==='marbles'){p.vy+=180*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y>338){p.y=338;p.vy=-Math.abs(p.vy)*.92;score++;}if(p.x<12||p.x>628){p.vx*=-1;p.x=Math.max(12,Math.min(628,p.x));}}else if(mode==='fireflies'){p.phase+=dt*(1+i%4*.15);p.x=(p.x+(Math.cos(p.phase)*22+p.vx*.1)*dt+640)%640;p.y=(p.y+(Math.sin(p.phase)*18+p.vy*.1)*dt+360)%360;}else{p.x=80+p.lane*160;p.y+=65*dt;if(p.y>360)p.y=0;}});}
window.playground={reset,step,interact,getState:()=>({time,score,particles:particles.map(p=>({...p}))})};reset();
function draw(){ctx.clearRect(0,0,640,360);ctx.strokeStyle='#ffffff12';ctx.lineWidth=1;for(let x=0;x<640;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,360);ctx.stroke();}if(mode==='rhythm'){ctx.strokeStyle='#ffb18a88';ctx.strokeRect(0,300,640,42);}particles.forEach((p,i)=>{ctx.fillStyle=['#bba2ff','#83ecc4','#ffb18a','#91c9ff'][i%4];ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=mode==='fireflies'?18:6;ctx.globalAlpha=mode==='fireflies'?.45+.55*(1+Math.sin(p.phase))/2:1;ctx.beginPath();ctx.arc(p.x,p.y,mode==='fireflies'?3:mode==='rhythm'?9:8+i%5,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;ctx.shadowBlur=0;document.querySelector('#score').textContent=score;document.querySelector('#clock').textContent=time.toFixed(1)+'s';}
let last=0;function frame(now){if(!last)last=now;if(!paused&&!document.hidden)step((now-last)/1000*speed);last=now;draw();requestAnimationFrame(frame);}requestAnimationFrame(frame);
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Resume':'Pause';};document.querySelector('#reset').onclick=reset;document.querySelector('#action').onclick=()=>interact(0);document.querySelector('#speed').oninput=e=>speed=Number(e.target.value);canvas.onclick=e=>interact(Math.min(3,Math.floor((e.clientX-canvas.getBoundingClientRect().left)/canvas.getBoundingClientRect().width*4)));document.addEventListener('keydown',e=>{const k=['a','s','d','f'].indexOf(e.key.toLowerCase());if(k>=0)interact(k);});if(matchMedia('(prefers-reduced-motion: reduce)').matches){paused=true;document.querySelector('#pause').textContent='Resume';}draw();</script></html>
